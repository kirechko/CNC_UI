# Выберите один backend: emulator, linux_cnc, grbl или fluid_nc.
# Пока LinuxCNC, GRBL и FluidNC адаптеры отладочные:
# их параметры выводятся в лог, но подключения к оборудованию ещё нет.
backend: emulator

emulator:
  socket_path: /tmp/linuxcnc-ui-emulator.sock

# Пример настройки LinuxCNC (для будущей реализации адаптера).
linuxcnc:
  socket_path: /run/linuxcnc/linuxcnc.sock

# Пример настройки GRBL по Serial/UART (для будущей реализации адаптера).
grbl:
  serial_port: /dev/serial/by-id/REPLACE_WITH_CONTROLLER_ID
  baud_rate: 115200

# Параметры FluidNC. Значения времени задаются в миллисекундах.
fluidnc:
  # Дополнительные IPv4-хосты или сети для автообнаружения: хост либо CIDR /24 или уже.
  discovery_port: []
  base_url: http://192.168.0.10
  websocket_rx_buffer_bytes: 128
  websocket_max_line_len: 80
  websocket_ack_timeout_ms: 2000
  websocket_status_timeout_ms: 1000
  websocket_connect_timeout_ms: 5000
