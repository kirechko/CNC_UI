# Проверка веб-интерфейса с платой ESP32 FluidNC на тестовой локальной сети.
# Этот профиль не меняет cnc-ui.yaml и стандартный backend эмулятора.
backend: fluid_nc_web_socket
fluidnc:
  # Optional IPv4 hosts or CIDRs; CIDRs must be /24 or narrower.
  discovery_port: []

  # Эти параметры используются только при backend: fluid_nc_rs232.
  serial_port: "/dev/serial/by-id/REPLACE_WITH_CONTROLLER_ID"
  baud_rate: 115200

# Для проверки через RS232 замените backend выше на:
# backend: fluid_nc_rs232
