# Machine-coordinate limits and motion dynamics.
# Units: millimeters, millimeters per minute, millimeters per second squared.
axes:
  x:
    min_mm: 0.0
    max_mm: 300.0
    max_velocity_mm_min: 15000.0
    acceleration_mm_s2: 1000.0
  y:
    min_mm: 0.0
    max_mm: 400.0
    max_velocity_mm_min: 15000.0
    acceleration_mm_s2: 1000.0
  z:
    min_mm: 0.0
    max_mm: 100.0
    max_velocity_mm_min: 5000.0
    acceleration_mm_s2: 500.0
  # Угловые оси A и B задаются в градусах; можно включить любую комбинацию Z/A/B.
  a:
    min_degrees: -180.0
    max_degrees: 180.0
    max_velocity_degrees_min: 3600.0
    acceleration_degrees_s2: 600.0
  # b:
  #   min_degrees: -180.0
  #   max_degrees: 180.0
  #   max_velocity_degrees_min: 3600.0
  #   acceleration_degrees_s2: 600.0

# Spindle simulation settings.
# RPM acceleration/deceleration rate.
spindle:
  min_rpm: 500.0
  max_rpm: 24000.0
  acceleration_rpm_per_sec: 3000.0

