# Automatic GitHub Releases for new versions.
#
# Trigger: push a tag named `v<semver>` (e.g. `v0.2.0`), or run the workflow
# manually (workflow_dispatch) to re-publish the current `tauri.conf.json`
# version. tauri-action builds the Tauri desktop app on each platform, creates
# (or updates) the Release for that tag and attaches every produced bundle:
#
#   Linux (ubuntu-22.04): .deb, .rpm, .AppImage, .tar.xz  (Tauri defaults)
#   Windows (windows-latest): .msi and NSIS .exe installers
#
# Releases start as DRAFTS: review the assets, then press "Publish release".
# Set the draft flag to false below to publish instantly. Unsigned builds —
# SmartScreen warnings are expected on Windows until code signing is
# configured (see the commented TAURI_SIGNING_* inputs at the bottom).
name: Release

on:
  push:
    tags:
      # Only semver tags trigger a release build.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch: {}

permissions:
  # tauri-action needs it to create releases and upload assets.
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            # Tauri builds the default Linux bundle set (deb/rpm/appimage...).
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Linux system libraries required by Tauri's WebKitGTK backend
      # (the same set as the Tauri v2 prerequisites guide).
      - name: Install Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js (provides npm for the Tauri CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs @tauri-apps/cli itself, runs `tauri build`, creates/updates
      # the GitHub Release for the triggered tag and uploads every bundle.
      # `tagName: v__VERSION__` resolves to the version in tauri.conf.json,
      # so a manual run publishes the exact version declared in the repo.
      - name: Build and publish bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment to sign Linux updater artifacts once keys are created:
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "CNC UI v__VERSION__"
          releaseBody: |
            Desktop builds of CNC UI v__VERSION__.

            Installers live in the Assets list below. Pick the package that
            matches your system (.deb/.rpm/.AppImage/.tar.xz for Linux,
            .msi/.exe for Windows). Builds are unsigned: expect a SmartScreen
            prompt on first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
