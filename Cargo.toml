[package]
name = "linuxcnc-ui"
version = "0.1.0"
edition = "2021"

default-run = "linuxcnc-ui"
license = "GPL-3.0-or-later"

[workspace]
members = ["cnc_core"]
resolver = "2"

[dependencies]
cnc_core = { path = "cnc_core" }
serde_yaml_ng = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tower-http = { version = "0.5", features = ["fs"] }
tauri = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
