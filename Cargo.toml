[package]
name = "linuxcnc-ui"
version = "0.1.0"
edition = "2021"

default-run = "linuxcnc-ui"
license = "GPL-3.0-or-later"
[dependencies]
serde_yaml_ng = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
gtk4 = "0.7"
glib = "0.18"
serialport = { version = "4", default-features = false }
