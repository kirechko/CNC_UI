[package]
name = "linuxcnc-ui"
version = "0.1.0"
edition = "2021"

default-run = "linuxcnc-ui"
license = "GPL-3.0-or-later"

[workspace]
members = ["cnc_core", "rosetta"]
resolver = "2"

[dependencies]
cnc_core = { path = "cnc_core" }
serde_yaml_ng = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.7"
async-stream = "0.3"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tower-http = { version = "0.5", features = ["fs"] }
tauri = "2"
# statvfs for the free-space line of the local FILES panel (Linux target).
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
