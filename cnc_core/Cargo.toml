[package]
name = "cnc_core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
async-trait = "0.1"
if-addrs = "0.13"
libc = "0.2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
tokio-serial = "5"
tokio-tungstenite = "0.24"
tracing = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
